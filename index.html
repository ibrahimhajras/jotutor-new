<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="https://i.ibb.co/XxGsLR3D/15.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoTutor - Middle East 1st Tutors platform</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- Mastercard Hosted Session and 3DS libraries -->
  <script src="https://ap-gateway.mastercard.com/form/version/100/merchant/9547143225EP/session.js"></script>
  <script src="https://ap-gateway.mastercard.com/static/threeDS/1.3.0/three-ds.min.js" data-merchant="9547143225EP"
    data-gateway="https://ap-gateway.mastercard.com"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blue: { 800: '#00152e', 900: '#002146' },
            green: { 500: '#84bc35', 600: '#6a992a' }
          },
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
            english: ['Futura PT', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'Futura PT';
      src: url('/futura_pt/FuturaCyrillicLight.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: 'Futura PT';
      src: url('/futura_pt/FuturaCyrillicBook.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Futura PT';
      src: url('/futura_pt/FuturaCyrillicMedium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Futura PT';
      src: url('/futura_pt/FuturaCyrillicDemi.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: 'Futura PT';
      src: url('/futura_pt/FuturaCyrillicBold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: 'Futura PT';
      src: url('/futura_pt/FuturaCyrillicExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
    }

    @font-face {
      font-family: 'Futura PT';
      src: url('/futura_pt/FuturaCyrillicHeavy.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
    }

    :root {
      --font-arabic: 'Cairo', sans-serif;
      --font-english: 'Futura PT', sans-serif;
    }

    html[lang="ar"],
    body[lang="ar"],
    .rtl {
      font-family: var(--font-arabic);
    }

    html[lang="en"],
    body[lang="en"],
    .ltr {
      font-family: var(--font-english);
    }

    body {
      margin: 0;
      padding: 0;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>

{
  "imports": {

  }
}
</script>
</head>
